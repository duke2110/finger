
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kính gửi anh Nam Vu</title>

    <style>
        :root {
            --pink: #ff0055;
            --cyan: #00ffff;
            --bg: #08020f;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            width: 100%;
            height: 100vh;
            height: 100dvh;
            display: grid;
            place-items: center;
            overflow: hidden;
            position: relative;
            background: radial-gradient(circle, #251035 0%, #10071d 45%, var(--bg) 100%);
            color: white;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        .ambient {
            position: absolute;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .ambient::before,
        .ambient::after {
            content: "";
            position: absolute;
            width: 45vw;
            height: 45vw;
            min-width: 280px;
            min-height: 280px;
            border-radius: 50%;
            filter: blur(100px);
            opacity: .2;
            animation: drift 12s ease-in-out infinite alternate;
        }

        .ambient::before {
            background: var(--pink);
            top: -15%;
            left: -15%;
        }

        .ambient::after {
            background: var(--cyan);
            right: -15%;
            bottom: -20%;
            animation-delay: -6s;
        }

        .grid-floor {
            position: absolute;
            inset: 0;
            pointer-events: none;
            opacity: .12;
            background-image:
                linear-gradient(#00ffff 1px, transparent 1px),
                linear-gradient(90deg, #00ffff 1px, transparent 1px);
            background-size: 55px 55px;
            mask-image: linear-gradient(to bottom, transparent, black);
            transform: perspective(500px) rotateX(35deg) scale(1.5);
            transform-origin: bottom;
        }

        #particleCanvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .container {
            position: relative;
            z-index: 2;
            width: 94%;
            text-align: center;
        }

        .emoji-wrap {
            display: inline-block;
            margin-bottom: 30px;
            animation: float 3.5s ease-in-out infinite;
        }

        .emoji-wrap::before {
            content: "";
            position: absolute;
            inset: 10%;
            border-radius: 50%;
            background: var(--pink);
            filter: blur(65px);
            opacity: .45;
            z-index: -1;
        }

        .emoji {
            display: block;
            border: 0;
            padding: 10px;
            background: transparent;
            font-size: clamp(100px, 21vw, 165px);
            line-height: 1.2;
            cursor: pointer;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            filter:
                drop-shadow(0 0 12px var(--pink))
                drop-shadow(0 0 35px var(--pink));
            transition: transform .25s, filter .25s;
        }

        .emoji:hover {
            transform: scale(1.15) rotate(6deg);
            filter:
                drop-shadow(0 0 15px var(--cyan))
                drop-shadow(0 0 45px var(--cyan));
        }

        .emoji:active {
            transform: scale(.85);
        }

        h1 {
            margin: 0;
            font-size: clamp(25px, 5.5vw, 44px);
            font-weight: 800;
            letter-spacing: clamp(1px, .4vw, 4px);
            color: white;
            text-shadow:
                0 0 5px white,
                0 0 12px var(--cyan),
                0 0 25px var(--cyan),
                0 0 45px var(--cyan);
            animation: flicker 5s linear infinite;
        }

        .scanlines {
            position: absolute;
            inset: 0;
            pointer-events: none;
            opacity: .07;
            background: repeating-linear-gradient(
                to bottom,
                transparent 0px,
                transparent 3px,
                rgba(0, 0, 0, .7) 4px
            );
        }

        .flash {
            position: absolute;
            inset: 0;
            pointer-events: none;
            background: var(--pink);
            opacity: 0;
        }

        .flash.active {
            animation: flash .3s ease-out;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        @keyframes drift {
            from { transform: translate(0, 0) scale(1); }
            to { transform: translate(12vw, 8vh) scale(1.25); }
        }

        @keyframes flicker {
            0%, 93%, 96%, 98%, 100% {
                opacity: 1;
            }
            94%, 97% {
                opacity: .75;
                text-shadow: 2px 0 var(--pink), -2px 0 var(--cyan);
            }
        }

        @keyframes flash {
            0% { opacity: .35; }
            100% { opacity: 0; }
        }

        @media (max-width: 480px) {
            h1 { letter-spacing: 1px; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: .01ms !important;
                animation-iteration-count: 1 !important;
            }
        }
    </style>
</head>

<body>
    <div class="ambient"></div>
    <div class="grid-floor"></div>
    <canvas id="particleCanvas"></canvas>
    <div class="flash" id="flash"></div>

    <main class="container">
        <div class="emoji-wrap">
            <button class="emoji" id="trigger" type="button"
                aria-label="Kích hoạt hiệu ứng neon">🖕</button>
        </div>

        <h1>kính gửi anh Nam Vu</h1>
    </main>

    <div class="scanlines"></div>

    <script>
        (() => {
            const canvas = document.getElementById("particleCanvas");
            const ctx = canvas.getContext("2d");
            const trigger = document.getElementById("trigger");
            const flash = document.getElementById("flash");

            if (!ctx) return;

            const colors = ["#ff0055", "#00ffff", "#a855f7"];
            const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)");

            let width, height, dpr;
            let particles = [];
            let bursts = [];
            let animationId;
            let lastTime = 0;
            let active = !document.hidden;

            const pointer = { x: -1000, y: -1000, active: false };

            const random = (min, max) =>
                Math.random() * (max - min) + min;

            class Particle {
                constructor(x, y, burst = false) {
                    this.x = x ?? random(0, width);
                    this.y = y ?? random(0, height);
                    this.size = burst ? random(1.5, 4) : random(1, 2.7);
                    this.color = colors[Math.floor(Math.random() * colors.length)];
                    this.alpha = random(.35, .9);
                    this.phase = random(0, Math.PI * 2);
                    this.twinkle = random(.7, 2);
                    this.burst = burst;
                    this.vx = burst ? random(-5, 5) : random(-.25, .25);
                    this.vy = burst ? random(-5, 5) : random(-.65, -.15);
                    this.life = 1;
                    this.decay = random(.012, .025);
                }

                update(dt, time) {
                    const factor = dt / 16.67;

                    this.x += this.vx * factor;
                    this.y += this.vy * factor;

                    if (this.burst) {
                        this.vx *= Math.pow(.985, factor);
                        this.vy *= Math.pow(.985, factor);
                        this.life -= this.decay * factor;
                        return this.life > 0;
                    }

                    if (pointer.active) {
                        const dx = this.x - pointer.x;
                        const dy = this.y - pointer.y;
                        const distSq = dx * dx + dy * dy;

                        if (distSq < 10000 && distSq > 1) {
                            const dist = Math.sqrt(distSq);
                            const force = (1 - distSq / 10000) * .35;
                            this.x += dx / dist * force * factor;
                            this.y += dy / dist * force * factor;
                        }
                    }

                    if (this.y < -10) {
                        this.y = height + 10;
                        this.x = random(0, width);
                    }

                    if (this.x < -10) this.x = width + 10;
                    if (this.x > width + 10) this.x = -10;

                    this.currentAlpha = this.alpha *
                        (.65 + .35 * Math.sin(time * .002 * this.twinkle + this.phase));

                    return true;
                }

                draw() {
                    ctx.globalAlpha = this.burst
                        ? Math.max(0, this.life)
                        : (this.currentAlpha ?? this.alpha);

                    ctx.fillStyle = this.color;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            function resize() {
                width = innerWidth;
                height = innerHeight;
                dpr = Math.min(devicePixelRatio || 1, 2);

                canvas.width = Math.round(width * dpr);
                canvas.height = Math.round(height * dpr);
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

                const count = Math.min(90,
                    Math.max(35, Math.floor(width * height / 15000)));

                particles = Array.from(
                    { length: count },
                    () => new Particle()
                );

                if (reducedMotion.matches) drawStatic();
            }

            function drawConnections() {
                const maxDistance = 115;
                const maxDistanceSq = maxDistance * maxDistance;

                ctx.lineWidth = .6;

                for (let i = 0; i < particles.length; i++) {
                    for (let j = i + 1; j < particles.length; j++) {
                        const a = particles[i];
                        const b = particles[j];
                        const dx = a.x - b.x;
                        const dy = a.y - b.y;
                        const distSq = dx * dx + dy * dy;

                        if (distSq < maxDistanceSq) {
                            ctx.globalAlpha =
                                (1 - distSq / maxDistanceSq) * .2;
                            ctx.strokeStyle = a.color;
                            ctx.beginPath();
                            ctx.moveTo(a.x, a.y);
                            ctx.lineTo(b.x, b.y);
                            ctx.stroke();
                        }
                    }
                }

                if (pointer.active) {
                    for (const p of particles) {
                        const dx = p.x - pointer.x;
                        const dy = p.y - pointer.y;
                        const dist = Math.sqrt(dx * dx + dy * dy);

                        if (dist < 130) {
                            ctx.globalAlpha = (1 - dist / 130) * .35;
                            ctx.strokeStyle = "#00ffff";
                            ctx.beginPath();
                            ctx.moveTo(p.x, p.y);
                            ctx.lineTo(pointer.x, pointer.y);
                            ctx.stroke();
                        }
                    }
                }
            }

            function drawStatic() {
                ctx.clearRect(0, 0, width, height);
                for (const p of particles) p.draw();
                drawConnections();
                ctx.globalAlpha = 1;
            }

            function animate(timestamp = 0) {
                if (!active || reducedMotion.matches) return;

                const dt = lastTime
                    ? Math.min(timestamp - lastTime, 40)
                    : 16.67;

                lastTime = timestamp;
                ctx.clearRect(0, 0, width, height);

                for (const p of particles) {
                    p.update(dt, timestamp);
                    p.draw();
                }

                drawConnections();

                bursts = bursts.filter(p => p.update(dt, timestamp));
                for (const p of bursts) p.draw();

                ctx.globalAlpha = 1;
                animationId = requestAnimationFrame(animate);
            }

            function explode(x, y) {
                for (let i = 0; i < 75; i++) {
                    bursts.push(new Particle(x, y, true));
                }

                if (bursts.length > 300) {
                    bursts.splice(0, bursts.length - 300);
                }
            }

            trigger.addEventListener("click", () => {
                const rect = trigger.getBoundingClientRect();
                explode(rect.left + rect.width / 2, rect.top + rect.height / 2);

                flash.classList.remove("active");
                void flash.offsetWidth;
                flash.classList.add("active");
            });

            window.addEventListener("pointermove", event => {
                pointer.x = event.clientX;
                pointer.y = event.clientY;
                pointer.active = event.pointerType !== "touch";
            }, { passive: true });

            window.addEventListener("pointerleave", () => {
                pointer.active = false;
            });

            window.addEventListener("resize", resize, { passive: true });

            document.addEventListener("visibilitychange", () => {
                active = !document.hidden;
                lastTime = 0;
                cancelAnimationFrame(animationId);

                if (active && !reducedMotion.matches) {
                    animationId = requestAnimationFrame(animate);
                }
            });

            reducedMotion.addEventListener?.("change", () => {
                cancelAnimationFrame(animationId);
                lastTime = 0;

                if (reducedMotion.matches) {
                    drawStatic();
                } else if (active) {
                    animationId = requestAnimationFrame(animate);
                }
            });

            resize();

            if (!reducedMotion.matches && active) {
                animationId = requestAnimationFrame(animate);
            } else {
                drawStatic();
            }
        })();
    </script>
</body>
</html>
